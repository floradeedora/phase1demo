<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My p5 Phone Sketch</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
    }
  </style>

  <!-- p5.js 2.x -->
  <script src="https://cdn.jsdelivr.net/npm/p5@2.3.2/lib/p5.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/p5.js-compatibility@0.2.0/src/preload.js"></script>
  <script>
    p5.prototype._incrementPreload ||= function() {};
    p5.prototype._decrementPreload ||= function() {};
  </script>
  
  <!-- Load ml5.js library -->
  <script src="https://unpkg.com/ml5@1/dist/ml5.min.js"></script>
  
  <!-- Load p5-phone library with camera support -->
  <script src="https://cdn.jsdelivr.net/npm/p5-phone@1.15.4/dist/p5-phone.min.js"></script>

  <script src="ml5-loading.js"></script>

</head>
<body>
  <script src="sketch.js"></script>
</body>
</html>
